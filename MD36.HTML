<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 33 - Employee System</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #eef2ff;
      color: #1e293b;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #4338ca;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 20px 0;
      border-radius: 14px;
      box-shadow: 0 5px 18px #00000012;
    }

    input, select {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 10px 15px;
      margin: 5px 3px 5px 0;
      border: 0;
      border-radius: 7px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }

    .delete {
      background: #dc2626;
    }

    .employee {
      border: 1px solid #e2e8f0;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    #message {
      color: #4338ca;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>💼 Employee Management</h1>
    <p style="text-align:center">Day 33 — JavaScript OOP</p>

    <div class="card">
      <h2>Add Employee</h2>

      <input id="name" placeholder="Employee name">
      <input id="age" type="number" min="18" max="100"
        placeholder="Age (18 or above)">
      <input id="department" placeholder="Department">

      <select id="role">
        <option value="developer">Developer</option>
        <option value="designer">Designer</option>
      </select>

      <button onclick="addEmployee()">Add Employee</button>
      <p id="message" aria-live="polite"></p>
    </div>

    <div class="card">
      <h2>Employee List</h2>
      <input id="search" placeholder="Search employees..."
        oninput="showEmployees()">

      <h3 id="count">Total: 0</h3>
      <div id="list"></div>
    </div>
  </div>

  <script>
    // Parent class
    class Employee {
      #salary;

      constructor(name, age, department) {
        this.name = name;
        this.age = age;
        this.department = department;
        this.#salary = 0;
      }

      setSalary(amount) {
        if (Number.isFinite(amount) && amount >= 0) {
          this.#salary = amount;
        }
      }

      getSalary() {
        return this.#salary;
      }

      getRole() {
        return "General Employee";
      }
    }

    // Child class: Inheritance
    class Developer extends Employee {
      constructor(name, age, department) {
        super(name, age, department);
      }

      // Polymorphism: apna version
      getRole() {
        return "Software Developer";
      }
    }

    class Designer extends Employee {
      constructor(name, age, department) {
        super(name, age, department);
      }

      getRole() {
        return "Web Designer";
      }
    }

    const employees = [];

    function addEmployee() {
      const name = document.getElementById("name").value.trim();
      const age = Number(document.getElementById("age").value);
      const department =
        document.getElementById("department").value.trim();
      const role = document.getElementById("role").value;
      const message = document.getElementById("message");

      if (!name || !department || !document.getElementById("age").value ||
          !Number.isInteger(age) || age < 18 || age > 100) {
        message.textContent = "Please enter valid details. Age must be 18–100.";
        return;
      }

      let employee;

      if (role === "developer") {
        employee = new Developer(name, age, department);
      } else {
        employee = new Designer(name, age, department);
      }

      // Demo salary value, not a real payroll record
      employee.setSalary(0);
      employees.push(employee);

      document.getElementById("name").value = "";
      document.getElementById("age").value = "";
      document.getElementById("department").value = "";

      message.textContent = "Employee added successfully!";
      showEmployees();
    }

    function showEmployees() {
      const list = document.getElementById("list");
      const query = document.getElementById("search")
        .value.trim().toLowerCase();

      list.replaceChildren();

      const matching = employees
        .map((employee, index) => ({ employee, index }))
        .filter(item =>
          item.employee.name.toLowerCase().includes(query) ||
          item.employee.department.toLowerCase().includes(query) ||
          item.employee.getRole().toLowerCase().includes(query)
        );

      document.getElementById("count").textContent =
        `Total Employees: ${employees.length} | Showing: ${matching.length}`;

      if (matching.length === 0) {
        list.textContent = "No employees found.";
        return;
      }

      matching.forEach(({ employee, index }) => {
        const card = document.createElement("div");
        card.className = "employee";

        const title = document.createElement("h3");
        title.textContent = employee.name;

        const details = document.createElement("p");
        details.textContent =
          `Age: ${employee.age} | Department: ${employee.department}`;

        const role = document.createElement("p");
        role.textContent = `Role: ${employee.getRole()}`;

        const salary = document.createElement("p");
        salary.textContent = `Demo salary value: ${employee.getSalary()}`;

        const remove = document.createElement("button");
        remove.className = "delete";
        remove.textContent = "Delete";
        remove.onclick = () => {
          employees.splice(index, 1);
          showEmployees();
        };

        card.append(title, details, role, salary, remove);
        list.appendChild(card);
      });
    }
  </script>
</body>
</html>
