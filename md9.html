<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Stylish Website</title>

    <style>
        body {
            background-color: #f0f4ff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        .card {
            background-color: white;
            padding: 30px;
            margin: 20px auto;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #b8c5dc;
        }

        h1 {
            color: #1746a2;
            font-size: 32px;
        }

        p {
            color: #444444;
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            background-color: #1746a2;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>My First Website</h1>
        <p>Hello Bro! Main Web Development seekh raha hoon.</p>
        <button>Learn More</button>
    </div>

</body>
</html>
