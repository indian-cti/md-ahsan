<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            padding: 20px;
        }

        .form-box {
            background: white;
            max-width: 400px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #cbd5e1;
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="form-box">
        <h1>Student Registration</h1>

        <form>
            <label for="name">Full Name</label>
            <input type="text" id="name"
                   placeholder="INDIAN COMPUTER TRAINING INSTITUTTE" required>

            <label for="email">Email</label>
            <input type="email" id="email"
                   placeholder="INDIANCTI2GMAIL.COM" required>

            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="INDIANCTI@IT" required>

            <label for="course">Select Course</label>
            <select id="course" required>
                <option value="">Choose a course</option>
                <option>Web Designing</option>
                <option>Python</option>
                <option>Power BI</option>
            </select>

            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
