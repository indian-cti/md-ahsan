<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 29 - Favorite Products</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    header {
      padding: 35px 16px;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #be123c, #7c3aed);
    }

    header h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 5vw, 38px);
    }

    header p {
      margin: 0;
      color: #ffe4e6;
    }

    .container {
      max-width: 1150px;
      margin: auto;
      padding: 24px 16px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      padding: 18px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 16px #0000000b;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
    }

    button {
      border: none;
      color: white;
      background: #4f46e5;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.88;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .favorite-view {
      background: #be123c;
    }

    .reset-btn {
      background: #475569;
    }

    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .stat {
      flex: 1;
      min-width: 140px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      text-align: center;
    }

    .stat strong {
      display: block;
      margin-top: 6px;
      font-size: 24px;
      color: #be123c;
    }

    #status {
      text-align: center;
      color: #64748b;
      margin: 25px 0;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .product-card {
      position: relative;
      overflow: hidden;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 16px #0000000c;
    }

    .product-image {
      display: block;
      width: 100%;
      height: 200px;
      padding: 15px;
      object-fit: contain;
      background: white;
    }

    .favorite-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
      background: #f1f5f9;
      color: #be123c;
      font-size: 23px;
      border: 1px solid #e2e8f0;
    }

    .product-info {
      padding: 16px;
    }

    .category {
      color: #7c3aed;
      font-size: 12px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .product-info h2 {
      font-size: 17px;
      min-height: 42px;
      margin: 10px 0;
    }

    .description {
      min-height: 54px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }

    .product-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
    }

    .price {
      color: #15803d;
      font-size: 20px;
      font-weight: bold;
    }

    .rating {
      color: #b45309;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: #64748b;
    }

    @media (max-width: 480px) {
      .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .product-image {
        height: 140px;
      }

      .product-info {
        padding: 11px;
      }

      .product-info h2 {
        font-size: 15px;
      }

      .product-footer {
        align-items: flex-start;
        flex-direction: column;
      }

      .price {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>❤️ My Favorite Products</h1>
    <p>Day 29 — API + Local Storage + Favorites</p>
  </header>

  <main class="container">

    <section class="toolbar" aria-label="Product controls">
      <input
        type="search"
        id="searchInput"
        placeholder="Search products..."
        aria-label="Search products"
      >

      <select id="categorySelect" aria-label="Filter by category">
        <option value="all">All Categories</option>
      </select>

      <button id="favoritesToggle" class="favorite-view" type="button">
        ❤️ Show Favorites
      </button>

      <button id="resetButton" class="reset-btn" type="button">
        Reset Filters
      </button>

      <button id="reloadButton" type="button">
        Reload Products
      </button>
    </section>

    <section class="stats" aria-label="Product statistics">
      <div class="stat">
        All Products
        <strong id="totalCount">0</strong>
      </div>

      <div class="stat">
        Favorites
        <strong id="favoriteCount">0</strong>
      </div>

      <div class="stat">
        Showing
        <strong id="showingCount">0</strong>
      </div>
    </section>

    <p id="status" role="status" aria-live="polite">
      Products load ho rahe hain...
    </p>

    <section
      id="productGrid"
      class="product-grid"
      aria-label="Product list"
    ></section>

  </main>

  <script>
    const API_URL = "https://dummyjson.com/products?limit=100";

    const searchInput = document.getElementById("searchInput");
    const categorySelect = document.getElementById("categorySelect");
    const favoritesToggle = document.getElementById("favoritesToggle");
    const resetButton = document.getElementById("resetButton");
    const reloadButton = document.getElementById("reloadButton");

    const productGrid = document.getElementById("productGrid");
    const statusText = document.getElementById("status");

    const totalCount = document.getElementById("totalCount");
    const favoriteCount = document.getElementById("favoriteCount");
    const showingCount = document.getElementById("showingCount");

    let allProducts = [];
    let showFavoritesOnly = false;

    // Local Storage se saved favorite IDs load karna
    function loadFavorites() {
      try {
        const saved = localStorage.getItem("day29Favorites");

        if (!saved) {
          return [];
        }

        const parsed = JSON.parse(saved);

        if (!Array.isArray(parsed)) {
          return [];
        }

        return parsed.filter(
          id => Number.isInteger(id) && id > 0
        );
      } catch (error) {
        console.error("Favorites load error:", error);
        return [];
      }
    }

    let favoriteIds = loadFavorites();

    // Favorite IDs save karna
    function saveFavorites() {
      try {
        localStorage.setItem(
          "day29Favorites",
          JSON.stringify(favoriteIds)
        );
      } catch (error) {
        console.error("Favorites save error:", error);
        statusText.textContent =
          "Favorites save nahi ho sake. Browser storage check karein.";
      }
    }

    // API se products load karna
    async function loadProducts() {
      statusText.className = "";
      statusText.textContent = "Loading products...";
      productGrid.replaceChildren();
      reloadButton.disabled = true;

      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error("API request failed");
        }

        const data = await response.json();

        allProducts = Array.isArray(data.products)
          ? data.products
          : [];

        // Dropdown mein unique categories add karna
        const categories = [
          ...new Set(allProducts.map(product => product.category))
        ].sort();

        categorySelect.replaceChildren();

        const allOption = document.createElement("option");
        allOption.value = "all";
        allOption.textContent = "All Categories";
        categorySelect.appendChild(allOption);

        categories.forEach(category => {
          const option = document.createElement("option");
          option.value = category;
          option.textContent = category;
          categorySelect.appendChild(option);
        });

        // Sirf maujood products ke favorite IDs rakhna
        const validIds = new Set(allProducts.map(product => product.id));

        favoriteIds = favoriteIds.filter(id => validIds.has(id));
        saveFavorites();

        statusText.textContent = "";
        applyFilters();

      } catch (error) {
        console.error("API Error:", error);

        statusText.className = "error";
        statusText.textContent =
          "Products load nahi hue. Internet check karke Reload dabayein.";

      } finally {
        reloadButton.disabled = false;
      }
    }

    // Favorite ya unfavorite karna
    function toggleFavorite(productId) {
      if (favoriteIds.includes(productId)) {
        favoriteIds = favoriteIds.filter(id => id !== productId);
      } else {
        favoriteIds.push(productId);
      }

      saveFavorites();
      applyFilters();
    }

    // Search, category aur favorites filters
    function applyFilters() {
      const searchText = searchInput.value.trim().toLowerCase();
      const category = categorySelect.value;

      let filteredProducts = allProducts.filter(product => {
        const matchesSearch =
          product.title.toLowerCase().includes(searchText);

        const matchesCategory =
          category === "all" || product.category === category;

        const matchesFavorite =
          !showFavoritesOnly || favoriteIds.includes(product.id);

        return matchesSearch && matchesCategory && matchesFavorite;
      });

      displayProducts(filteredProducts);
    }

    // Products ke cards banana
    function displayProducts(products) {
      productGrid.replaceChildren();

      totalCount.textContent = allProducts.length;
      favoriteCount.textContent = favoriteIds.length;
      showingCount.textContent = products.length;

      if (products.length === 0) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "empty";
        emptyMessage.textContent = showFavoritesOnly
          ? "Abhi koi favorite product nahi hai. ❤️ button dabakar favorite add karein."
          : "Koi matching product nahi mila.";

        productGrid.appendChild(emptyMessage);
        statusText.textContent = "";
        return;
      }

      statusText.textContent = "";

      products.forEach(product => {
        const card = document.createElement("article");
        card.className = "product-card";

        const image = document.createElement("img");
        image.className = "product-image";
        image.src = product.thumbnail;
        image.alt = product.title;
        image.loading = "lazy";

        image.addEventListener("error", () => {
          image.alt = "Image unavailable";
          image.removeAttribute("src");
        }, { once: true });

        const isFavorite = favoriteIds.includes(product.id);

        const favoriteButton = document.createElement("button");
        favoriteButton.className = "favorite-btn";
        favoriteButton.type = "button";
        favoriteButton.textContent = isFavorite ? "♥" : "♡";
        favoriteButton.setAttribute(
          "aria-label",
          isFavorite ? "Remove from favorites" : "Add to favorites"
        );
        favoriteButton.setAttribute(
          "aria-pressed",
          String(isFavorite)
        );

        favoriteButton.addEventListener("click", () => {
          toggleFavorite(product.id);
        });

        const info = document.createElement("div");
        info.className = "product-info";

        const categoryLabel = document.createElement("div");
        categoryLabel.className = "category";
        categoryLabel.textContent = product.category;

        const title = document.createElement("h2");
        title.textContent = product.title;

        const description = document.createElement("p");
        description.className = "description";
        description.textContent = product.description;

        const footer = document.createElement("div");
        footer.className = "product-footer";

        const price = document.createElement("span");
        price.className = "price";
        price.textContent = "$" + product.price.toFixed(2);

        const rating = document.createElement("span");
        rating.className = "rating";
        rating.textContent = "★ " + product.rating;

        footer.append(price, rating);
        info.append(categoryLabel, title, description, footer);

        card.append(image, favoriteButton, info);
        productGrid.appendChild(card);
      });
    }

    // Sirf favorite products dikhana
    favoritesToggle.addEventListener("click", () => {
      showFavoritesOnly = !showFavoritesOnly;

      favoritesToggle.textContent = showFavoritesOnly
        ? "🛍️ Show All Products"
        : "❤️ Show Favorites";

      applyFilters();
    });

    searchInput.addEventListener("input", applyFilters);
    categorySelect.addEventListener("change", applyFilters);

    resetButton.addEventListener("click", () => {
      searchInput.value = "";
      categorySelect.value = "all";
      showFavoritesOnly = false;

      favoritesToggle.textContent = "❤️ Show Favorites";

      applyFilters();
    });

    reloadButton.addEventListener("click", loadProducts);

    // Page khulte hi products load karo
    loadProducts();
  </script>
</body>
</html>
