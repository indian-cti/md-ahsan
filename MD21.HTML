<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: #243247;
            padding: 25px;
            border-radius: 15px;
        }

        li {
            background: #34445c;
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
        }

        button {
            padding: 12px 20px;
            background: #00c896;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎓 Student List</h1>

        <p id="total"></p>

        <ul id="studentList"></ul>

        <button onclick="showStudents()">
            Show Students
        </button>
    </div>

    <script>
        let students = [
            "Aman","Rahul","Priya","Ali","Neha"
        ];
        function showStudents() {
            let list = document.getElementById("studentList");
            list.innerHTML = "";
            for (let i = 0; i < students.length; i++) {
                list.innerHTML += "<li>" + students[i] + "</li>";
            }
            document.getElementById("total").textContent =
                "Total Students: " + students.length;
        }
    </script>
</body>
</html>
