<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Day 27 - Student Directory</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #eef2ff;
      color: #1e293b;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      color: #4338ca;
      margin-bottom: 8px;
    }

    header p {
      color: #64748b;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #3730a3;
    }

    #status {
      text-align: center;
      margin: 20px 0;
      color: #64748b;
    }

    .student-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(230px, 1fr)
      );
      gap: 18px;
    }

    .student-card {
      padding: 22px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px #0000000d;
      border: 1px solid #e2e8f0;
    }

    .avatar {
      width: 55px;
      height: 55px;
      display: grid;
      place-items: center;
      margin-bottom: 15px;
      background: #e0e7ff;
      color: #4338ca;
      border-radius: 50%;
      font-size: 22px;
      font-weight: bold;
    }

    .student-card h2 {
      font-size: 19px;
      margin: 0 0 12px;
    }

    .student-card p {
      font-size: 14px;
      color: #64748b;
      overflow-wrap: anywhere;
    }

    .student-card a {
      color: #4338ca;
      text-decoration: none;
    }

    .student-card a:hover {
      text-decoration: underline;
    }

    .count {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 15px;
      border-radius: 10px;
      background: white;
    }

    @media (max-width: 480px) {
      .toolbar {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <h1>🎓 Student Directory</h1>
      <p>Day 27: Learn JavaScript API & Fetch</p>
    </header>

    <div class="toolbar">
      <input
        type="text"
        id="searchInput"
        placeholder="Search by name or email..."
        aria-label="Search students"
      >

      <button id="loadButton" type="button">
        Reload Students
      </button>
    </div>

    <div class="count">
      Total students: <strong id="studentCount">0</strong>
    </div>

    <p id="status" role="status" aria-live="polite">
      Students load ho rahe hain...
    </p>

    <section
      id="studentGrid"
      class="student-grid"
      aria-label="Student list"
    ></section>

  </main>

  <script>
    const API_URL =
      "https://jsonplaceholder.typicode.com/users";

    const studentGrid =
      document.getElementById("studentGrid");

    const statusText =
      document.getElementById("status");

    const searchInput =
      document.getElementById("searchInput");

    const loadButton =
      document.getElementById("loadButton");

    const studentCount =
      document.getElementById("studentCount");

    let allStudents = [];

    // API se students ka data lana
    async function loadStudents() {
      statusText.textContent = "Loading students...";
      studentGrid.replaceChildren();
      studentCount.textContent = "0";
      loadButton.disabled = true;

      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error("Server se data nahi mila.");
        }

        const students = await response.json();

        allStudents = students;

        displayStudents(allStudents);

        statusText.textContent =
          allStudents.length > 0
            ? "Students successfully load ho gaye!"
            : "Koi student nahi mila.";

      } catch (error) {
        console.error("API Error:", error);

        statusText.textContent =
          "Data load nahi hua. Internet check karke retry karein.";
      } finally {
        loadButton.disabled = false;
      }
    }

    // Students ko website par dikhana
    function displayStudents(students) {
      studentGrid.replaceChildren();

      studentCount.textContent = students.length;

      if (students.length === 0) {
        statusText.textContent = "Koi matching student nahi mila.";
        return;
      }

      statusText.textContent = "";

      students.forEach(function(student) {
        const card = document.createElement("article");
        card.className = "student-card";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = student.name.charAt(0).toUpperCase();

        const name = document.createElement("h2");
        name.textContent = student.name;

        const email = document.createElement("p");
        email.textContent = "Email: " + student.email;

        const city = document.createElement("p");
        city.textContent = "City: " + student.address.city;

        const website = document.createElement("p");
        website.textContent = "Website: ";

        const websiteLink = document.createElement("a");
        websiteLink.textContent = student.website;

        // URL mein protocol nahi hai to HTTPS add karo
        const safeWebsite = student.website.startsWith("http")
          ? student.website
          : "https://" + student.website;

        websiteLink.href = safeWebsite;
        websiteLink.target = "_blank";
        websiteLink.rel = "noopener noreferrer";

        website.appendChild(websiteLink);

        card.append(
          avatar,
          name,
          email,
          city,
          website
        );

        studentGrid.appendChild(card);
      });
    }

    // Search functionality
    searchInput.addEventListener("input", function() {
      const searchText = searchInput.value
        .trim()
        .toLowerCase();

      const filteredStudents = allStudents.filter(
        function(student) {
          return (
            student.name.toLowerCase().includes(searchText) ||
            student.email.toLowerCase().includes(searchText)
          );
        }
      );

      displayStudents(filteredStudents);
    });

    // Reload button
    loadButton.addEventListener("click", loadStudents);

    // Page open hote hi data load karo
    loadStudents();
  </script>
</body>
</html>
