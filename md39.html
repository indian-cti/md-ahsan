<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 36 - Weather App</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #0f172a, #2563eb, #38bdf8);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 650px;
      padding: 28px;
      border: 1px solid #ffffff45;
      border-radius: 24px;
      background: #ffffff18;
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 45px #00000025;
    }

    h1 { text-align: center; }

    .search {
      display: flex;
      gap: 10px;
      margin: 24px 0;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 13px 17px;
      border: none;
      border-radius: 10px;
      background: #facc15;
      color: #1e293b;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .current { text-align: center; padding: 10px; }

    #icon { font-size: 64px; }

    #temperature {
      font-size: 54px;
      font-weight: bold;
      margin: 8px 0;
    }

    #description { font-size: 20px; }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 25px;
    }

    .detail {
      padding: 18px;
      border-radius: 14px;
      background: #ffffff20;
      overflow-wrap: anywhere;
    }

    .detail span {
      display: block;
      margin-top: 8px;
      font-size: 20px;
      font-weight: bold;
    }

    #status {
      text-align: center;
      min-height: 24px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .app { padding: 18px; }
      .search { flex-direction: column; }
      .details { gap: 9px; }
      .detail { padding: 13px; }
      #temperature { font-size: 44px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>🌦️ Weather Dashboard</h1>
    <p style="text-align:center">Day 36 — Live Weather API</p>

    <form class="search" id="searchForm">
      <input
        id="cityInput"
        placeholder="Enter city, e.g. Delhi"
        aria-label="City name"
        required
      >
      <button id="searchButton" type="submit">Search</button>
    </form>

    <p id="status" aria-live="polite">
      Enter a city to check its weather.
    </p>

    <section id="weather" hidden>
      <div class="current">
        <h2 id="cityName"></h2>
        <div id="icon">🌤️</div>
        <div id="temperature">--°C</div>
        <div id="description"></div>
      </div>

      <div class="details">
        <div class="detail">
          🌡️ Feels like
          <span id="feelsLike">--°C</span>
        </div>

        <div class="detail">
          💧 Humidity
          <span id="humidity">--%</span>
        </div>

        <div class="detail">
          💨 Wind speed
          <span id="wind">-- km/h</span>
        </div>

        <div class="detail">
          🕒 Local time
          <span id="localTime">--</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("searchForm");
    const cityInput = document.getElementById("cityInput");
    const button = document.getElementById("searchButton");
    const status = document.getElementById("status");
    const weather = document.getElementById("weather");

    function weatherDescription(code) {
      if (code === 0) return ["Clear sky", "☀️"];
      if ([1, 2].includes(code)) return ["Mostly clear / partly cloudy", "🌤️"];
      if (code === 3) return ["Overcast", "☁️"];
      if ([45, 48].includes(code)) return ["Foggy", "🌫️"];
      if ([51, 53, 55, 56, 57].includes(code)) return ["Drizzle", "🌦️"];
      if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) {
        return ["Rain", "🌧️"];
      }
      if ([71, 73, 75, 77, 85, 86].includes(code)) {
        return ["Snow", "❄️"];
      }
      if ([95, 96, 99].includes(code)) return ["Thunderstorm", "⛈️"];
      return ["Weather conditions", "🌡️"];
    }

    async function getWeather(city) {
      button.disabled = true;
      weather.hidden = true;
      status.textContent = "Searching city and loading weather...";

      try {
        const geoUrl =
          "https://geocoding-api.open-meteo.com/v1/search?name=" +
          encodeURIComponent(city) +
          "&count=1&language=en&format=json";

        const geoResponse = await fetch(geoUrl);

        if (!geoResponse.ok) {
          throw new Error("City search service unavailable.");
        }

        const geoData = await geoResponse.json();
        const place = geoData.results?.[0];

        if (!place) {
          throw new Error("City nahi mili. Spelling check karo.");
        }

        const params = new URLSearchParams({
          latitude: place.latitude,
          longitude: place.longitude,
          current: [
            "temperature_2m",
            "relative_humidity_2m",
            "apparent_temperature",
            "is_day",
            "weather_code",
            "wind_speed_10m"
          ].join(","),
          timezone: "auto"
        });

        const response = await fetch(
          "https://api.open-meteo.com/v1/forecast?" + params
        );

        if (!response.ok) {
          throw new Error("Weather service unavailable.");
        }

        const data = await response.json();
        const current = data.current;

        if (!current) {
          throw new Error("Weather data nahi mila.");
        }

        const [description, icon] =
          weatherDescription(current.weather_code);

        document.getElementById("cityName").textContent =
          place.name + (place.country ? ", " + place.country : "");

        document.getElementById("icon").textContent =
          current.is_day === 0 && current.weather_code === 0
            ? "🌙" : icon;

        document.getElementById("temperature").textContent =
          Math.round(current.temperature_2m) + "°C";

        document.getElementById("description").textContent = description;

        document.getElementById("feelsLike").textContent =
          Math.round(current.apparent_temperature) + "°C";

        document.getElementById("humidity").textContent =
          current.relative_humidity_2m + "%";

        document.getElementById("wind").textContent =
          current.wind_speed_10m + " km/h";

        document.getElementById("localTime").textContent =
          current.time.replace("T", " ");

        weather.hidden = false;
        status.textContent = "Weather updated successfully!";

      } catch (error) {
        status.textContent = error.message ||
          "Something went wrong. Please try again.";
        console.error("Weather API error:", error);

      } finally {
        button.disabled = false;
      }
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const city = cityInput.value.trim();

      if (city) {
        getWeather(city);
      }
    });
  </script>
</body>
</html>
