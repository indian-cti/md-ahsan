<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 28 - Product Explorer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      padding: 35px 20px;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #4338ca, #7c3aed);
    }

    header h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 5vw, 38px);
    }

    header p {
      margin: 0;
      color: #e0e7ff;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 25px 18px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 22px;
      padding: 20px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 15px #00000008;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      border: none;
      background: #4f46e5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #3730a3;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .summary span {
      padding: 12px 16px;
      background: white;
      border-radius: 9px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      overflow: hidden;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 18px #0000000b;
      transition: transform 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-image {
      display: block;
      width: 100%;
      height: 190px;
      padding: 12px;
      object-fit: contain;
      background: #fff;
    }

    .product-info {
      padding: 16px;
    }

    .category {
      color: #6366f1;
      font-size: 12px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .product-info h2 {
      min-height: 44px;
      margin: 10px 0;
      font-size: 17px;
    }

    .description {
      min-height: 54px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 15px;
    }

    .price {
      color: #15803d;
      font-size: 21px;
      font-weight: bold;
    }

    .rating {
      color: #b45309;
      font-size: 14px;
    }

    #status {
      text-align: center;
      color: #64748b;
      margin: 25px 0;
    }

    .error {
      color: #b91c1c !important;
    }

    @media (max-width: 480px) {
      .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .product-image {
        height: 140px;
      }

      .product-info {
        padding: 11px;
      }

      .product-info h2 {
        font-size: 15px;
      }

      .product-bottom {
        align-items: flex-start;
        flex-direction: column;
      }

      .price {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🛍️ Product Explorer</h1>
    <p>Day 28 — Learn JSON, Filter, Map and Sort</p>
  </header>

  <main class="container">

    <section class="filters" aria-label="Product filters">
      <input
        id="searchInput"
        type="search"
        placeholder="Search products..."
        aria-label="Search products"
      >

      <select id="categorySelect" aria-label="Choose category">
        <option value="all">All Categories</option>
      </select>

      <input
        id="maxPrice"
        type="number"
        min="0"
        placeholder="Maximum price ($)"
        aria-label="Maximum price"
      >

      <select id="sortSelect" aria-label="Sort products">
        <option value="default">Default order</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
        <option value="rating">Highest Rated</option>
        <option value="name">Name: A to Z</option>
      </select>

      <button id="resetButton" type="button">
        Reset Filters
      </button>

      <button id="reloadButton" type="button">
        Reload Products
      </button>
    </section>

    <div class="summary">
      <span>Products found: <strong id="productCount">0</strong></span>
      <span>Data source: Public test API</span>
    </div>

    <p id="status" role="status" aria-live="polite">
      Products load ho rahe hain...
    </p>

    <section
      id="productGrid"
      class="product-grid"
      aria-label="Products"
    ></section>
  </main>

  <script>
    const API_URL = "https://dummyjson.com/products?limit=100";

    const searchInput = document.getElementById("searchInput");
    const categorySelect = document.getElementById("categorySelect");
    const maxPriceInput = document.getElementById("maxPrice");
    const sortSelect = document.getElementById("sortSelect");
    const resetButton = document.getElementById("resetButton");
    const reloadButton = document.getElementById("reloadButton");

    const productGrid = document.getElementById("productGrid");
    const productCount = document.getElementById("productCount");
    const statusText = document.getElementById("status");

    let allProducts = [];

    // STEP 1: API se data load karna
    async function loadProducts() {
      statusText.className = "";
      statusText.textContent = "Loading products...";
      productGrid.replaceChildren();
      productCount.textContent = "0";

      reloadButton.disabled = true;

      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error("Products load nahi ho sake.");
        }

        // JSON response ko JavaScript object mein convert karna
        const data = await response.json();

        // API ke products array ko save karna
        allProducts = Array.isArray(data.products)
          ? data.products
          : [];

        if (allProducts.length === 0) {
          statusText.textContent = "Koi product available nahi hai.";
          return;
        }

        // Unique categories banana
        const categories = [
          ...new Set(allProducts.map(product => product.category))
        ].sort();

        // Dropdown mein categories add karna
        categorySelect.replaceChildren();

        const allOption = document.createElement("option");
        allOption.value = "all";
        allOption.textContent = "All Categories";
        categorySelect.appendChild(allOption);

        categories.forEach(category => {
          const option = document.createElement("option");
          option.value = category;
          option.textContent = category;
          categorySelect.appendChild(option);
        });

        statusText.textContent = "";
        applyFilters();

      } catch (error) {
        console.error("API Error:", error);

        statusText.className = "error";
        statusText.textContent =
          "Products load nahi hue. Internet check karke Reload dabayein.";

      } finally {
        reloadButton.disabled = false;
      }
    }

    // STEP 2: Search, category aur price filter
    function applyFilters() {
      const searchText = searchInput.value.trim().toLowerCase();
      const selectedCategory = categorySelect.value;
      const maxPriceText = maxPriceInput.value.trim();
      const maxPrice = Number(maxPriceText);
      const hasMaxPrice = maxPriceText !== "";

      let filteredProducts = allProducts.filter(product => {
        const matchesName =
          product.title.toLowerCase().includes(searchText);

        const matchesCategory =
          selectedCategory === "all" ||
          product.category === selectedCategory;

        const matchesPrice =
          !hasMaxPrice || product.price <= maxPrice;

        return matchesName && matchesCategory && matchesPrice;
      });

      // STEP 3: Sorting
      const sortType = sortSelect.value;

      if (sortType === "low") {
        filteredProducts.sort((a, b) => a.price - b.price);
      } else if (sortType === "high") {
        filteredProducts.sort((a, b) => b.price - a.price);
      } else if (sortType === "rating") {
        filteredProducts.sort((a, b) => b.rating - a.rating);
      } else if (sortType === "name") {
        filteredProducts.sort((a, b) =>
          a.title.localeCompare(b.title)
        );
      }

      displayProducts(filteredProducts);
    }

    // STEP 4: Products ko cards mein dikhana
    function displayProducts(products) {
      productGrid.replaceChildren();
      productCount.textContent = products.length;

      if (products.length === 0) {
        statusText.className = "";
        statusText.textContent = "Koi matching product nahi mila.";
        return;
      }

      statusText.className = "";
      statusText.textContent = "";

      // Map se har product ka card banana
      const cards = products.map(product => {
        const card = document.createElement("article");
        card.className = "product-card";

        const image = document.createElement("img");
        image.className = "product-image";
        image.src = product.thumbnail;
        image.alt = product.title;
        image.loading = "lazy";

        image.addEventListener("error", () => {
          image.alt = "Product image unavailable";
          image.removeAttribute("src");
        }, { once: true });

        const info = document.createElement("div");
        info.className = "product-info";

        const category = document.createElement("div");
        category.className = "category";
        category.textContent = product.category;

        const title = document.createElement("h2");
        title.textContent = product.title;

        const description = document.createElement("p");
        description.className = "description";
        description.textContent = product.description;

        const bottom = document.createElement("div");
        bottom.className = "product-bottom";

        const price = document.createElement("span");
        price.className = "price";
        price.textContent = "$" + product.price.toFixed(2);

        const rating = document.createElement("span");
        rating.className = "rating";
        rating.textContent = "★ " + product.rating;

        bottom.append(price, rating);
        info.append(category, title, description, bottom);
        card.append(image, info);

        return card;
      });

      // Saare cards ek saath add karna
      productGrid.append(...cards);
    }

    // STEP 5: Filter controls ke events
    searchInput.addEventListener("input", applyFilters);
    categorySelect.addEventListener("change", applyFilters);
    maxPriceInput.addEventListener("input", applyFilters);
    sortSelect.addEventListener("change", applyFilters);

    // Reset button
    resetButton.addEventListener("click", () => {
      searchInput.value = "";
      categorySelect.value = "all";
      maxPriceInput.value = "";
      sortSelect.value = "default";

      applyFilters();
    });
    // Reload button
    reloadButton.addEventListener("click", loadProducts);
    // Page open hote hi products load karna
    loadProducts();
  </script>
</body>
</html>
