<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #243b55);
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 550px;
            margin: 20px auto;
            padding: 28px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 18px;
            box-shadow: 0 12px 35px #0005;
        }

        h1 {
            text-align: center;
            color: #5eead4;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #64748b;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: 2px solid #2dd4bf;
            border-color: transparent;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2dd4bf;
            color: #102a2a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5eead4;
        }

        #message {
            margin-top: 18px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .success {
            color: #86efac;
        }

        .error {
            color: #fca5a5;
        }

        .hint {
            margin-top: 6px;
            font-size: 13px;
            color: #cbd5e1;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>🎓 Student Registration</h1>

        <p class="subtitle">
            Enter your details to practice form validation.
        </p>

        <form id="registrationForm" novalidate>

            <label for="fullName">Full Name</label>
            <input
                type="text"
                id="fullName"
                placeholder="Enter your name"
                maxlength="60"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="example@email.com"
                required
            >

            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                placeholder="Enter age"
                min="13"
                max="100"
                required
            >

            <label for="course">Choose Course</label>
            <select id="course" required>
                <option value="">-- Select Course --</option>
                <option value="Web Development">Web Development</option>
                <option value="Python">Python Programming</option>
                <option value="Power BI">Power BI</option>
                <option value="Graphic Design">Graphic Design</option>
            </select>

            <p class="hint">
                This is a practice form. It does not send or save data.
            </p>

            <button type="submit">Validate Form</button>

        </form>

        <div id="message" role="status" aria-live="polite"></div>

    </main>

    <script>
        const form = document.getElementById("registrationForm");

        const fullName = document.getElementById("fullName");
        const email = document.getElementById("email");
        const age = document.getElementById("age");
        const course = document.getElementById("course");

        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const nameValue = fullName.value.trim();
            const emailValue = email.value.trim();
            const ageValue = age.value;
            const courseValue = course.value;

            let errors = [];

            // Validate name.
            if (nameValue.length < 2) {
                errors.push("Name must contain at least 2 characters.");
            }

            // Validate email format.
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(emailValue)) {
                errors.push("Please enter a valid email address.");
            }

            // Validate age.
            if (
                ageValue === "" ||
                !Number.isFinite(Number(ageValue)) ||
                Number(ageValue) < 13 ||
                Number(ageValue) > 100
            ) {
                errors.push("Age must be between 13 and 100.");
            }

            // Validate course.
            if (courseValue === "") {
                errors.push("Please select a course.");
            }

            // Display errors or success.
            message.replaceChildren();

            if (errors.length > 0) {
                message.className = "error";

                const heading = document.createElement("strong");
                heading.textContent = "Please fix these errors:";

                const list = document.createElement("ul");

                errors.forEach(function(error) {
                    const item = document.createElement("li");
                    item.textContent = error;
                    list.appendChild(item);
                });

                message.appendChild(heading);
                message.appendChild(list);

            } else {
                message.className = "success";

                const heading = document.createElement("h3");
                heading.textContent = "Registration Details Valid! 🎉";

                const details = document.createElement("p");
                details.textContent =
                    "Name: " + nameValue +
                    " | Email: " + emailValue +
                    " | Age: " + ageValue +
                    " | Course: " + courseValue;

                const note = document.createElement("p");
                note.textContent =
                    "Demo only: your details have not been saved or submitted.";

                message.appendChild(heading);
                message.appendChild(details);
                message.appendChild(note);
            }
        });
    </script>

</body>
</html>
