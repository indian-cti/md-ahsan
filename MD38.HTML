<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 35 - Live User Directory</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #eef2ff;
      color: #1e293b;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #4338ca;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    input {
      flex: 1;
      min-width: 200px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover { background: #3730a3; }

    #status {
      padding: 12px;
      background: white;
      border-radius: 8px;
    }

    .users {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .user-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #00000010;
      overflow-wrap: anywhere;
    }

    .user-card h3 { color: #4338ca; }

    .email { color: #475569; }

    @media (max-width: 500px) {
      body { padding: 12px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>🌐 Live User Directory</h1>
    <p style="text-align:center">
      Day 35 — Async/Await + Fetch API
    </p>

    <div class="toolbar">
      <input
        id="search"
        type="search"
        placeholder="Search users by name..."
        aria-label="Search users"
      >
      <button id="reload">Reload Users</button>
    </div>

    <p id="status" aria-live="polite">Ready to load users.</p>
    <section id="users" class="users" aria-label="User list"></section>
  </main>

  <script>
    const usersContainer = document.getElementById("users");
    const status = document.getElementById("status");
    const searchInput = document.getElementById("search");
    const reloadButton = document.getElementById("reload");

    let users = [];

    // async function API se data load karega
    async function loadUsers() {
      status.textContent = "Loading users...";
      reloadButton.disabled = true;
      usersContainer.replaceChildren();

      try {
        // await API response ka wait karta hai
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/users"
        );

        if (!response.ok) {
          throw new Error("Server response: " + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error("Unexpected data received.");
        }

        users = data;
        showUsers();

      } catch (error) {
        console.error("API error:", error);

        status.textContent =
          "Users load nahi hue. Internet check karke Reload Users dabao.";

      } finally {
        reloadButton.disabled = false;
      }
    }

    function showUsers() {
      const query = searchInput.value.trim().toLowerCase();

      const filteredUsers = users.filter(user =>
        user.name.toLowerCase().includes(query)
      );

      usersContainer.replaceChildren();

      status.textContent =
        `Total users: ${users.length} | Showing: ${filteredUsers.length}`;

      if (filteredUsers.length === 0) {
        status.textContent += " — No matching users.";
        return;
      }

      filteredUsers.forEach(user => {
        const card = document.createElement("article");
        card.className = "user-card";

        const name = document.createElement("h3");
        name.textContent = user.name;

        const email = document.createElement("p");
        email.className = "email";
        email.textContent = "Email: " + user.email;

        const city = document.createElement("p");
        city.textContent = "City: " + user.address.city;

        const company = document.createElement("p");
        company.textContent = "Company: " + user.company.name;

        card.append(name, email, city, company);
        usersContainer.appendChild(card);
      });
    }

    searchInput.addEventListener("input", showUsers);
    reloadButton.addEventListener("click", loadUsers);

    // Page open hone par API call
    loadUsers();
  </script>
</body>
</html>
